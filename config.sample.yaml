# A realistic, fully filled-in config to imitate — every value here is fictional.
#
# This is what a working install actually looks like: the credentials and the athlete
# profile, plus the handful of knobs this particular install had a reason to change.
# Everything else is left at its default and simply absent, which is the normal state —
# a config file is not meant to restate the defaults back to the app.
#
# config_template.yaml is the blank version of this file; config_template_full.yaml
# documents every knob that could appear here. Copy this to config.yaml (gitignored)
# and make it yours.
#
# What makes a profile useful is honesty and texture: the free-text blocks below
# (injuries, preferences) are read verbatim by the LLM coach, so write them the way
# you'd brief a human coach — specifics, quirks, non-negotiables.

llm:
  api_key: "sk-or-v1-EXAMPLEKEYEXAMPLEKEYEXAMPLEKEYEXAMPLEKEY"   # or OPENROUTER_API_KEY
  # `settings list coach-model` numbers these; `settings set coach-model` switches;
  # first is the default coach.
  models:
    - model: "anthropic/claude-opus-5"
    - model: "openai/gpt-5.6-sol"
    - model: "google/gemini-3.1-pro-preview"
  # A cheap model is plenty for routing free-text chat messages to a command.
  router_model: "google/gemini-3.1-pro-preview"

google:
  service_account_file: "service_account.json"
  calendar_id: "trainmate-workouts@group.calendar.google.com"

garmin:
  email: "sam@example.com"
  password: "correct-horse-battery-staple"

coach:
  # This athlete rides a 3-week block and wants generation to match it.
  workout_generation_span_days: 21

user_profile:
  name: "Sam"
  birth_year: 1986
  gender: "female"
  max_hr: 188
  weekly_target_hours: 8.0
  sport_preferences:
    - "cycling"
    - "strength_training"
    - "trail_running"
    - "hiking"
    - "yoga"
  chronic_injuries: |
    Left ACL reconstructed years ago; the knee dislikes hard pivoting, so no
    court or stop-and-go sports. Running is fine on trails, unpleasant on
    pavement beyond ~45 minutes.
  preferences: |
    Prioritize long-term health span and longevity: structural strength, joint
    resilience, mixed-intensity cardiovascular capacity, proactive recovery.
    Endurance is the competitive outlet — I ride with a fast weekend group and
    want to hold my own — but strength is a year-round priority in its own
    right, not just support for the current goal: keep 2 sessions/week through
    every phase, including taper and off-season. Trim their volume when the
    endurance block demands it, but never drop them entirely.

    I consistently over-do sessions that are prescribed easy — call this out.

    Weekdays I ride the smart trainer for time efficiency and structure;
    weekends I want to be outside if the weather allows. Where I live is
    hilly, and my house sits on top of a ~200 m hill — every outdoor ride
    ends with that climb whether the plan wants it or not.

    A short kettlebell circuit once in a while is welcome as a change of pace.
  equipment:
    - "Garmin watch with HR strap"
    - "carbon road bike"
    - "smart trainer with Zwift"
    - "trail running shoes"
    - "16/24 kg kettlebells"
  weekly_schedule:
    Monday:
      total_available_hours: 1.3
      max_sessions: 1
      certainty_percent: 100
      equipment:
        - "office gym (full featured)"
    Tuesday:
      total_available_hours: 1.3
      max_sessions: 1
      certainty_percent: 100
      equipment:
        - "smart trainer"
        - "kettlebells"
    Wednesday:
      total_available_hours: 1.3
      max_sessions: 1
      certainty_percent: 100
      equipment:
        - "office gym (full featured)"
    Thursday:
      total_available_hours: 1.3
      max_sessions: 1
      certainty_percent: 100
      equipment:
        - "smart trainer"
        - "kettlebells"
    Friday:
      total_available_hours: 2.0
      max_sessions: 1
      certainty_percent: 90
      equipment:
        - "smart trainer"
        - "kettlebells"
    Saturday:
      total_available_hours: 3.0
      max_sessions: 2
      certainty_percent: 60
      equipment:
        - "road bike"
        - "smart trainer"
        - "trail shoes"
    Sunday:
      total_available_hours: 3.0
      max_sessions: 2
      certainty_percent: 70
      equipment:
        - "road bike"
        - "smart trainer"
        - "trail shoes"
        - "kettlebells"

telegram:
  bot_token: "123456789:AAExampleExampleExampleExampleExampleExa"   # or TELEGRAM_BOT_TOKEN
  allowed_chat_ids:
    - 123456789
  # Plan generation runs long; the 180s default was killing it mid-answer.
  command_timeout_seconds: 600
