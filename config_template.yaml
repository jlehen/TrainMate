llm:
  api_key: "YOUR_OPENROUTER_API_KEY"
  model: "google/gemini-3.5-flash"
  # Seconds an OpenRouter HTTP request may run before it's aborted. Generation is
  # slow (large plans), so keep this generous. Default 120.
  #request_timeout_seconds: 120

# Minimum minutes before an automatic refresh re-pulls — gates both Garmin hits and
# Calendar-context syncs; within this window reads reuse the local cache. Bypass a single
# run with --force-pull.
#refresh_minutes: 120

# Days a coaching learning may go unreinforced before it goes dormant (dropped from
# coach prompts) and earns a one-level staleness demotion, per confidence level. A
# dormant learning revives the moment new supporting evidence lands.
#learning_staleness_days:
#  tentative: 21
#  moderate: 60
#  established: 180

# Flask web front-end (run trainmate_web.py directly). Optional — omit to use defaults.
#web:
#  # Interface to bind. Loopback by default so the dev server isn't exposed on all
#  # interfaces; set to 0.0.0.0 to serve the LAN.
#  #host: "127.0.0.1"
#  #port: 5000
#  # Werkzeug debugger/reloader. Leave off — the interactive debugger is a remote
#  # code-execution vector on any traceback and must never be on for a reachable bind.
#  #debug: false

# Telegram chat front-end (run with ./tm-bot). Optional — omit the whole block to
# disable it. Create a bot with @BotFather to get the token; message the bot once
# and check the logs (or @userinfobot) for your numeric chat id.
#telegram:
#  # Bot token from @BotFather. May instead be set via the TELEGRAM_BOT_TOKEN env var.
#  bot_token: "123456789:ABCdef..."
#  # Allowlist of chat ids permitted to drive the bot. Empty/absent = nobody.
#  allowed_chat_ids:
#    - 123456789
#  # Seconds a command may go silent before it's killed (generation is slow).
#  #command_timeout_seconds: 180
#  # Seconds to wait for you to answer an interactive prompt (tap a button or send
#  # text) before the command is cancelled. Default 300.
#  #prompt_timeout_seconds: 300
#  # Column width replies wrap to. The CLI's terminal default (80) double-wraps on a
#  # phone; ~48 fits portrait without the client re-wrapping. Raise on tablets.
#  #wrap_width: 48

google:
  # Service-account JSON file used to authenticate to the Google APIs.
  service_account_file: "service_account.json"
  # Google Calendar that planned workouts are written to / read from.
  calendar_id: "a05efe90aef057e16bf8f423500dda43244ae61b3bd1a9990f55cade1f4e8549@group.calendar.google.com"
  # Source tag for calendar events containing daily context.
  #calendar_context_tag: "trainmate-context"

garmin:
  email: "you@example.com"
  password: "your-garmin-password"
  # Directory where the garminconnect OAuth tokens are persisted.
  #token_dir: "~/.garminconnect"
  # Trailing days a forward-refresh re-fetches to catch late-finalizing data.
  #mutable_days: 3
  # Backward-gap size above which a backfill is surfaced as a command rather
  # than run automatically; also gates interior gaps.
  #backfill_prompt_days: 30
  # Range used to build the cold-start backfill command.
  #initial_backfill_days: 90
  # Sleep between Garmin API calls (--sleep overrides it on `data pull`).
  #throttle_seconds: 0.2
  # Minimum fraction of an activity that must fall inside a known HR zone before
  # hrTSS is trusted; below it, effort sat under zone 1 and hrTSS undercounts, so
  # RPE is preferred. Calibrated against the activity history. Default 0.5.
  #hr_zone_coverage_min: 0.5

coach:
  # Days of recent metrics history fed to the coach as context.
  #metrics_lookback_days: 15
  # Days to look back for a preceding goal when generating a new one.
  #goals_lookback_days: 90
  # Default span generated by the workout-generation command.
  #workout_generation_span_days: 28
  # `constraint add`/`edit` replan proposal (DESIGN_constraints.md §7): propose a
  # replan when a constraint's overlapping planned load is at least this percentage
  # of the plan's trailing weekly planned load...
  #replan_displaced_load_pct: 50
  # ...OR, independently, when a `hard` constraint spans at least this many days.
  #replan_hard_span_days: 3
  # Relative drift (percent) a physiological threshold (max_hr/lthr/ftp) may move
  # from the value the active plan was generated with before the plan is flagged
  # stale. Small retest corrections flow into workout targets without invalidating
  # the periodization strategy.
  #threshold_replan_pct: 5
  # Thresholds to compute high intensity workouts.
  #high_intensity_rpe_threshold: 8
  #high_intensity_tss_threshold: 120.0
  # Quantitative context-impact alignment (alcohol, big meal, …). 'lookahead' (k) is
  # how many mornings bracket each signal episode before/after, and the drink-free gap
  # below which two signal runs merge into one episode. 'min_signal_days' is the floor
  # of total signal-days a category needs before its rows are shown to the coach.
  #context_days_lookahead: 3
  #context_days_min_signal_days: 1
  # Workload score below which an activity counts as "minor": widens the
  # planned-vs-actual mismatch tolerance and labels unplanned activities as minor.
  #minor_activity_load_threshold: 25.0
  # Ratio of RPE-implied load to measured (power/HR) load above which a session is
  # flagged to the coach as "felt harder than it measured" (hidden fatigue: heat,
  # sleep debt, muscular damage, e.g. kettlebell HIIT). Set very high to disable.
  #rpe_divergence_ratio: 1.5
  # Dynamic +/- tolerance band for the planned-vs-actual duration/workload check:
  # easy_pct applies at planned loads <= low_load, hard_pct at loads >= high_load,
  # linearly interpolated between (looser for easy sessions, tighter for hard ones).
  #adherence_tolerance:
  #  easy_pct: 0.50
  #  hard_pct: 0.15
  #  low_load: 20.0
  #  high_load: 100.0

user_profile:
  name: "Athlete"
  birth_year: 1980
  max_hr: 185
  lthr: 165
  ftp: 220
  weekly_target_hours: 6.0
  sport_preferences:
    - "running"
    - "road_biking"
    - "hiking"
    - "strength_training"
    - "yoga"
    - "ski_touring"
  chronic_injuries: |
    Sensitive lower back. Avoid high-impact running on pavement when flared up.
  preferences: |
    Enjoys morning workouts. Prefers outdoor trail runs and road cycling.
  equipment:
    - "Garmin watch"
    - "running shoes"
    - "road bike"
  # Per-day availability. certainty_percent is how likely you are to actually
  # train that day (the coach weights planning toward higher-certainty days).
  weekly_schedule:
    Monday:
      total_available_hours: 1.0
      max_sessions: 1
      certainty_percent: 100
      equipment:
        - "kettlebells"
        - "dumbbells"
        - "yoga mat"
    Tuesday:
      total_available_hours: 1.5
      max_sessions: 1
      certainty_percent: 80
      equipment:
        - "road bike"
        - "home trainer"
    Wednesday:
      total_available_hours: 0.0
      max_sessions: 0
      certainty_percent: 100
      equipment: []
    Thursday:
      total_available_hours: 1.5
      max_sessions: 1
      certainty_percent: 80
      equipment:
        - "road bike"
        - "home trainer"
    Friday:
      total_available_hours: 1.0
      max_sessions: 1
      certainty_percent: 90
      equipment:
        - "kettlebells"
        - "dumbbells"
        - "yoga mat"
    Saturday:
      total_available_hours: 3.0
      max_sessions: 2
      certainty_percent: 70
      equipment:
        - "road bike"
    Sunday:
      total_available_hours: 2.0
      max_sessions: 1
      certainty_percent: 70
      equipment:
        - "running shoes"
