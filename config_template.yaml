# TrainMate — the short template: the settings you have to fill in.
#
# Copy this to config.yaml (gitignored) and replace the placeholders. Everything not
# listed here has a working default, so this file is a complete, runnable config once
# the four credential blocks below are real.
#
# Every remaining knob — Garmin pull behaviour, load and zone thresholds, coaching
# lookbacks, replan triggers, logging, the web UI — is documented at length in
# config_template_full.yaml. Copy a block over from there when you want to change it.
# config.sample.yaml shows a realistic filled-in config to imitate.

llm:
  # An OPENROUTER_API_KEY environment variable overrides this.
  api_key: "YOUR_OPENROUTER_API_KEY"
  # Models this install may use. `model list` numbers them in this order; the first
  # entry is the default until `settings set coach-model` picks another.
  models:
    - model: "google/gemini-3.5-flash"
    - model: "anthropic/claude-opus-5"

google:
  # Service-account JSON used to authenticate to the Google APIs. A relative path
  # resolves against this config file's directory.
  service_account_file: "service_account.json"
  # The calendar planned workouts are written to and read back from.
  calendar_id: "YOUR_CALENDAR_ID@group.calendar.google.com"

garmin:
  email: "you@example.com"
  password: "your-garmin-password"

# The athlete the coach plans for. This block is the single biggest influence on the
# quality of the plan, so fill it in honestly rather than optimistically — the free-text
# fields are read verbatim by the coach, so write them the way you'd brief a human one.
user_profile:
  name: "Athlete"
  birth_year: 1980
  # Free text, so sex-specific physiology can shape the plan. Omit and the coach plans
  # sex-neutral.
  gender: "female"
  max_hr: 185
  # Trainable thresholds (FTP, LTHR, threshold pace, CSS, e1RM, …) do NOT go here —
  # record them in the dated benchmark logbook, which is what the coach reads:
  #   ./tm benchmark record cycling --ftp 220
  # With none on record the coach prescribes by RPE/HR feel and schedules a benchmark.
  weekly_target_hours: 6.0
  sport_preferences:
    - "running"
    - "cycling"
    - "hiking"
    - "strength_training"
    - "yoga"
  chronic_injuries: |
    Sensitive lower back. Avoid high-impact running on pavement when flared up.
  preferences: |
    Enjoys morning workouts. Prefers outdoor trail runs and road cycling.
  equipment:
    - "Garmin watch"
    - "running shoes"
    - "road bike"
  # Per-day availability. Optional: omit the whole block and the coach places sessions
  # on any day, sized by weekly_target_hours. certainty_percent is how likely you are to
  # actually train that day — the coach weights planning toward higher-certainty days.
  weekly_schedule:
    Monday:
      total_available_hours: 1.0
      max_sessions: 1
      certainty_percent: 100
      equipment:
        - "kettlebells"
        - "yoga mat"
    Tuesday:
      total_available_hours: 1.5
      max_sessions: 1
      certainty_percent: 80
      equipment:
        - "road bike"
        - "home trainer"
    Wednesday:
      total_available_hours: 0.0
      max_sessions: 0
      certainty_percent: 100
      equipment: []
    Thursday:
      total_available_hours: 1.5
      max_sessions: 1
      certainty_percent: 80
      equipment:
        - "road bike"
        - "home trainer"
    Friday:
      total_available_hours: 1.0
      max_sessions: 1
      certainty_percent: 90
      equipment:
        - "kettlebells"
        - "yoga mat"
    Saturday:
      total_available_hours: 3.0
      max_sessions: 2
      certainty_percent: 70
      equipment:
        - "road bike"
    Sunday:
      total_available_hours: 2.0
      max_sessions: 1
      certainty_percent: 70
      equipment:
        - "running shoes"

# Extra daily-signal categories, on top of the shipped ones (alcohol, disturbed_sleep,
# illness, heat, stress, travel, underfuelling). A signal is something that HAPPENED TO
# you on given days and helps explain your recovery numbers. The description tells the
# coach what counts and, where there is one, what unit 'value' is in.
# A sleep-related category must keep "sleep" in its name — see config_template_full.yaml.
coach:
  signal_metrics:
    altitude: "sleeping or training above ~1500 m; value = altitude in metres"
    medication: "a drug that moves recovery — antihistamine, steroid, decongestant"

# Optional: drive TrainMate from your phone (./tm-bot). Omit the whole block to disable
# it. Create a bot with @BotFather for the token; message it once and use @userinfobot
# to find your numeric chat id. See config_template_full.yaml for the timeouts, the
# 'simple' companion persona and the morning push.
#telegram:
#  bot_token: "123456789:ABCdef..."   # or set TELEGRAM_BOT_TOKEN
#  # Allowlist of chat ids permitted to drive the bot. Empty/absent = nobody.
#  allowed_chat_ids:
#    - 123456789

# Second athlete, same checkout: give them their own config file and select it with
# TRAINMATE_CONFIG=/path/to/other/config.yaml ./tm status. Their database, logs, science
# guidelines and Garmin token store all land beside that file. See `data_dir:` in
# config_template_full.yaml for keeping two instances side by side in one directory.
