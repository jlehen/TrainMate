# TrainMate — the complete configuration reference.
#
# Every key the application reads appears below. The ones a working install must fill in
# carry values; every tuning knob is commented out at the value the code already uses, so
# deleting a commented line changes nothing and uncommenting one takes effect immediately.
#
# Three files describe the same settings at three lengths:
#   config_template.yaml       the short template — only what you must fill in. Start here.
#   config_template_full.yaml  this file — every knob, and why it exists.
#   config.sample.yaml         a realistic filled-in config to imitate (values fictional).
#
# Copy whichever suits you to config.yaml (gitignored) and make it yours.
#
# Two secrets can come from the environment instead of being written to disk:
#   OPENROUTER_API_KEY    overrides `llm.api_key`.
#   TELEGRAM_BOT_TOKEN    overrides `telegram.bot_token`.
# A third variable, TRAINMATE_CONFIG, picks which config file a command runs against —
# that is how one checkout serves two athletes. See "Two athletes, one checkout" below.


# ---------------------------------------------------------------------------
# Words this file uses
# ---------------------------------------------------------------------------
# load        One number for what a session cost you. Power or heart rate gives it (TSS /
#             hrTSS); with neither, your RPE does. A hard hour is roughly 100.
# RPE         Rate of Perceived Exertion — how hard it felt, 1-10, typed in by you.
# plan        The periodization: one macrocycle (the whole run-up to a goal) cut into
#             mesocycles, a.k.a. *blocks* — a few weeks each with one focus (base, build,
#             peak, recovery). Written by `plan generate`.
# schedule    The individual dated sessions, written by `workout generate` inside the plan.
#             The sessions are not the plan; the two are generated by different commands.
# runway      How many days of already-scheduled sessions you still have ahead of you.
# learning    A sentence the coach model wrote about you from your own history — "your
#             Tuesday intervals suffer after a Monday strength session". Each carries a
#             confidence of tentative, moderate or established, earned from how many weeks
#             of evidence back it up. `tm learnings` lists and curates them.
# signal      Something you log about a day that is not training but still moves your
#             recovery — alcohol, a broken night, heat, stress, illness. `tm signal add`.
# anchor      A measured number a workout can be prescribed against — FTP, LTHR, threshold
#             pace, CSS, max HR. All but max HR live in the benchmark logbook
#             (`tm benchmark`), not in this file.
# zone        A heart-rate zone. "Uncovered" time is recorded time that no zone claims,
#             usually because the effort sat below zone 1.
# CTL / ATL   Fitness and fatigue: two moving averages of daily load, one slow, one fast.
#             Their difference is TSB, "form". `tm progress` charts all three.


llm:
  # An OPENROUTER_API_KEY environment variable overrides this.
  api_key: "YOUR_OPENROUTER_API_KEY"
  # The models this install is allowed to use. `settings list coach-model` numbers them in
  # the order you write them here, and the first one is the coach until you pick another
  # with `settings set coach-model` (DESIGN_model_selection.md §1). Write each entry either
  # as a bare string or as a `model:` mapping like the ones below — the mapping form exists
  # so per-model options can be added later without you reformatting the list.
  # Recommended coach: the most recent Claude Opus (README, "Choosing a model").
  models:
    - model: "anthropic/claude-opus-5"
    - model: "google/gemini-3.5-flash"
  # Seconds one OpenRouter request may run before it is abandoned. Writing a whole plan
  # takes a while, so keep this generous. Default 120.
  #request_timeout_seconds: 120
  # In simple ui mode the Telegram bot reads your free-text messages to work out which
  # command you meant (DESIGN_bot_simple_frontend.md §5.4). That job is small, so it can go
  # to a cheaper model than the coaching itself. Name one of the `models:` entries above —
  # one allowlist covers both roles. This only seeds the `router-model` setting;
  # `settings set router-model` changes it live. Unset, the coaching model routes too.
  # Recommended: Gemini Flash.
  #router_model: "google/gemini-3.5-flash"

# Where this instance keeps its files. Every relative path in this file — the database,
# science_dir, the logging directory, service_account_file, the Garmin token_dir — resolves
# against it, and it is itself relative to the directory holding this config file. Leave it
# unset and that config directory *is* the data directory, so all state lands beside the
# config. Set it to move one instance's whole state under a single subdirectory instead of
# prefixing each path key below by hand; an absolute path on an individual key still wins.
#data_dir: "athlete2"

# The SQLite database this install operates on. A relative path resolves against this
# config file's directory (or `data_dir:` when set); default trainmate.db beside it.
#database: "trainmate.db"

# Your own sports-science guidelines: a directory of *.md files pasted into every coaching
# prompt as the ATHLETE-PROVIDED block, so you can tell the coach how you want to be
# coached (README, "The science directory"). A relative path resolves against this config
# file's directory; default science/ beside it. Point a second athlete at their own
# directory to give them their own training philosophy, or point two instances at the same
# absolute path to share one. Either way the guidelines the app itself ships
# (trainmate/science/) are still applied.
#science_dir: "science"

# Two trails the app writes for whoever runs it: the run journal (runs/YYYY-MM-DD.jsonl,
# one line per event, read back with `tm journal`) and the full text of every exchange with
# the model (llm_exchanges/*.md). They exist for you to read when something looks wrong —
# the app never reads them back to make a decision (DESIGN_logging.md §2.1). Every key has
# a working default, so leaving the whole block out behaves exactly as shown.
#logging:
#  # Where those two directories go. Relative paths resolve like `database:` above, so a
#  # second instance keeps its own logs. Default logs/ beside the config.
#  #dir: "logs"
#  # Lowest level that reaches the journal file: debug | info | warn | error.
#  # `debug` additionally records the exceptions the app catches and hides on screen.
#  #level: "info"
#  # How many days each directory keeps. The clean-up runs at most once a day, off the
#  # first command to finish after midnight UTC; `tm journal prune` forces one now.
#  #retain_days: 90
#  #retain_exchange_days: 90

# ---------------------------------------------------------------------------
# Two athletes, one checkout
# ---------------------------------------------------------------------------
# Give the second athlete a config file of their own and point every command at it:
#   TRAINMATE_CONFIG=/path/to/other/config.yaml ./tm status     (and likewise ./tm-bot)
# Put that file in its own directory and the database and other relative paths land there
# too; or keep both configs side by side and give the second one a `data_dir:` (above).
# Either way the two instances must not share state: each needs its own Telegram bot token,
# its own Garmin credentials and token_dir (see the warning there), its own Google
# calendar_id, its own logs/, and — unless `science_dir:` says otherwise — its own science/
# guidelines beside it. A file named in TRAINMATE_CONFIG must exist: a typo aborts the
# command rather than quietly falling back to the first athlete's database.

# How fresh cached data must be before a command re-pulls it. Within this many minutes of
# the last pull, reads reuse the local copy instead of hitting Garmin or re-reading the
# calendar for signals. `--force-pull` ignores it for a single run.
#refresh_minutes: 120

# How long a learning may go without fresh supporting evidence before the app stops showing
# it to the coach ("dormant") and proposes knocking its confidence down one level. The
# better-established the learning, the longer the rope: six months of evidence should not
# lapse as fast as a hunch from three weeks. Nothing is lost either way — a dormant learning
# revives the moment new supporting evidence lands, and the demotion is only a proposal
# (`tm learnings demote` accepts it, `tm learnings keep` refuses it).
#learning_staleness_days:
#  tentative: 21
#  moderate: 60
#  established: 180

# Before it writes a plan, the coach reads a cached reconstruction of your training history.
# That cache does not refresh itself: `data bootstrap` builds it once and `data reflect`
# brings it forward. If the newest history in it is more than this many days behind today,
# `plan generate` says so and points you at `data reflect`, rather than planning off a stale
# picture in silence.
#analysis_staleness_days: 14

# How much evidence a learning needs to reach each confidence level, counted in distinct
# weeks — weeks that support it, minus weeks that contradict it. Only these two levels are
# adjustable — tentative is always >=1 net week, and a learning at 0 or below is proposed
# for retirement. Change these and every learning is re-levelled on the next recompute; no
# migration, nothing is lost.
#learning_confidence_thresholds:
#  moderate: 3
#  established: 5

# Flask web front-end (run trainmate_web.py directly). Optional — omit to use defaults.
#web:
#  # Interface to bind. Loopback by default so the dev server isn't exposed on every
#  # interface; set to 0.0.0.0 to serve the LAN.
#  #host: "127.0.0.1"
#  #port: 5000
#  # Werkzeug's debugger/reloader. Leave off: its interactive debugger hands a remote
#  # visitor code execution on any traceback, so it must never be on for a reachable bind.
#  #debug: false

# Telegram chat front-end (run with ./tm-bot). Optional — omit the whole block to disable
# it. Create a bot with @BotFather to get the token; message the bot once and check the
# logs (or @userinfobot) for your numeric chat id.
#telegram:
#  # Bot token from @BotFather. May instead be set via the TELEGRAM_BOT_TOKEN env var.
#  bot_token: "123456789:ABCdef..."
#  # Allowlist of chat ids permitted to drive the bot. Empty/absent = nobody.
#  allowed_chat_ids:
#    - 123456789
#  # Seconds a command may go silent before it's killed (generation is slow).
#  #command_timeout_seconds: 180
#  # Seconds to wait for you to answer an interactive prompt (tap a button or send text)
#  # before the command is cancelled. Default 300.
#  #prompt_timeout_seconds: 300
#  # Column width replies wrap to. The CLI's terminal default of 80 gets wrapped a second
#  # time by a phone and comes out ragged; ~48 fits a portrait screen so the client leaves
#  # it alone. Raise it on tablets. Ignored in simple ui mode, which sends flowing prose
#  # and lets the client wrap it.
#  #wrap_width: 48
#  # Which face the bot puts on (DESIGN_bot_simple_frontend.md). 'expert' (the default) is
#  # the raw CLI over chat. 'simple' is companion mode for a non-technical athlete: a reply
#  # keyboard, free-text messages routed to the right command, the morning push below, and
#  # answers in plain prose. Typed /commands still work in simple mode.
#  #ui: expert
#  # Your name, as the companion says it to the athlete (simple ui mode only). The athlete
#  # already calls the app "coach", so the person running the CLI needs a different word:
#  # this is what fills the blank in "tell ___ — setting up a new goal happens from the
#  # computer". Unset, that reads "the person who set this up for you".
#  #operator_name: Alex
#  # Morning push (simple ui mode only): the bot opens the day by itself with today's
#  # session and a few follow-up buttons. It records what it has sent in the instance's
#  # database, so restarting the bot never double-sends.
#  # Each key below only seeds a setting; change any of them live with `settings set`
#  # (`push`, `morning-time`, `morning-deadline`, `adapt-first`) and the running bot picks
#  # the change up within five minutes. Quote the times — an unquoted 07:30 is not a time
#  # as far as YAML is concerned.
#  #push:
#  #  # Off-switch for the push without leaving simple mode.
#  #  #enabled: true
#  #  # Local time the push fires.
#  #  #morning_time: "08:00"
#  #  # If the machine or the bot was down at morning_time, still catch up until this local
#  #  # time; after it, skip the day — a workout briefing at 9 PM is just noise.
#  #  #morning_deadline: "15:00"
#  #  # Re-run the daily adaptation (workout adapt -y, no questions asked) before writing
#  #  # the push, so it accounts for overnight signals. Costs one LLM call every morning.
#  #  #adapt_first: false

google:
  # Service-account JSON file used to authenticate to the Google APIs.
  service_account_file: "service_account.json"
  # Google Calendar that planned workouts are written to / read from.
  calendar_id: "YOUR_CALENDAR_ID@group.calendar.google.com"
  # Source tag for calendar events containing daily signals.
  #calendar_signal_tag: "trainmate-context"

garmin:
  email: "you@example.com"
  password: "your-garmin-password"
  # Directory where the garminconnect OAuth tokens are kept between runs. A relative path
  # resolves against this config file's directory (or `data_dir:` when set), like
  # `database:`; the default is .garminconnect beside it.
  # WARNING for two-athlete setups: a valid token store beats the credentials above, so if
  # two configs share a directory the second one silently resumes the first athlete's
  # Garmin session. Give each instance its own token_dir.
  #token_dir: ".garminconnect"
  # Garmin keeps revising the last day or two of data after the fact. Every forward refresh
  # therefore re-fetches this many trailing days rather than only what is new.
  #mutable_days: 3
  # A backward gap larger than this is not filled automatically — the app prints the
  # backfill command and lets you decide, since a long fetch is slow and rate-limited.
  # Gaps in the middle of your history are held to the same bar.
  #backfill_prompt_days: 30
  # How far back the first-run backfill command reaches, on a database with no history yet.
  #initial_backfill_days: 90
  # Pause between Garmin API calls, to stay under their rate limit. `data pull --sleep`
  # overrides it for one run.
  #throttle_seconds: 0.2
  # How much of an activity must fall inside a known heart-rate zone before its hrTSS is
  # believed. Below this bar the effort mostly sat under zone 1, where hrTSS under-counts
  # it, so your RPE is used for the load instead. Default 0.5, calibrated against the
  # activity history.
  #hr_zone_coverage_min: 0.5
  # The key above decides the *load*. The next three only decide what `tm progress` says
  # about how patchy its zone coverage was.
  #
  # Shortest activity allowed to raise an under-count marker ('?' on the load table, '!' on
  # the zone tables) in `tm progress`. A 5-minute mobility session with a cold strap is not
  # evidence that a 340-TSS week was under-counted, nor evidence about the strap. Shorter
  # sessions still contribute their load and their zone minutes; they just lose their vote
  # on the markers. Default 20 minutes.
  #zone_min_activity_minutes: 20
  # How much of a sport's weekly duration must land inside a known zone before its row
  # stops flagging itself as patchy. Deliberately stricter than hr_zone_coverage_min: that
  # one decides whether the load can be trusted, this one only decides whether a table
  # admits the picture is incomplete. Default 0.8.
  #zone_coverage_display_min: 0.8
  # Per-sport overrides of that bar, keyed by canonical sport name. Uncovered time is not
  # always a recording failure — it is also the rest between sets, the chairlift back up,
  # the flat walking on a hike, the held pose, all of which sit below zone 1 where no zone
  # claims them. trainmate/intensity.py already ships lower bars for the sports where that
  # is structural (strength_training 0.45, downhill_skiing and indoor_climbing 0.15, hiking
  # 0.10, yoga 0.05); every other sport uses the bar above. Add an entry here to override
  # either.
  #zone_coverage_display_min_by_sport:
  #  strength_training: 0.45
  #  hiking: 0.10
  # How many days of load each moving average averages over: CTL is fitness, ATL fatigue.
  # FOR DELIBERATE EXPERIMENTS ONLY. The bands the app reads the results against (TSB
  # -30/+25, ramp 3-5/8, ATL:CTL 1.3/1.5) and the CLI's colouring are all calibrated to
  # 42/7, and they do not move with these keys — so a non-default value changes what the
  # numbers mean while the app carries on judging them as if it hadn't
  # (DESIGN_pmc_fitness_fatigue.md §3.4). The defaults are the supported configuration.
  # Both must be positive integers. Editing them recomputes nothing on its own; the change
  # lands on the next data pull, wipe or backfill.
  #pmc_ctl_days: 42
  #pmc_atl_days: 7

coach:
  # Days of recent metrics history fed to the coach as context.
  #metrics_lookback_days: 15
  # When working out where a new plan should start, the app looks for the goal that came
  # before it. This is how far back that search reaches.
  #goals_lookback_days: 90
  # How many days of sessions `workout generate` writes when you don't say.
  #workout_generation_span_days: 28
  # The last few days of a block are its terminal window: an adaptation made there has no
  # time left to rebound from, and the next block is not yet in reach. Inside it the coach
  # is told to hold the planned load rather than shuffle it (DESIGN_block_boundary.md §3).
  # This governs what the coach MODEL is told; the CLI's own "you're running out of
  # sessions" hint is runway_warning_days below, and is a different thing.
  #adapt_terminal_window_days: 3
  # How many days ahead `workout adapt`, `status` and the morning push start warning that
  # your scheduled sessions are about to run out — and how many days past the end they keep
  # saying it before giving up (DESIGN_runway_nudge.md §7). Wider than the terminal window
  # above on purpose: extending the schedule is a deliberate act you may reasonably sit on
  # for a few days, and a week gives the nudge room to be seen twice.
  #runway_warning_days: 7
  # When you add or edit a constraint, the app offers to replan if the constraint really
  # disrupts the plan (DESIGN_constraints.md §7). Two independent triggers, either alone
  # being enough. First: the planned load the constraint collides with is at least this
  # percentage of a typical recent week's planned load...
  #replan_displaced_load_pct: 50
  # ...second: a `rest` constraint runs at least this many days, however little load it
  # happened to displace. (A config using the old name `replan_hard_span_days` still works;
  # write the current name in a new one.)
  #replan_rest_span_days: 3
  # How far an anchor may drift, in percent, from the value the active plan was built on
  # before the plan is flagged stale — max_hr from this file, or a logbook anchor like FTP
  # or LTHR. Below this, a retest just flows into the workout targets: a 3% FTP bump is not
  # a reason to rethink the periodization.
  #threshold_replan_pct: 5
  # Which of your completed sessions get listed to the coach as a week's highlights when it
  # reviews your history. A session qualifies if its load reaches the TSS figure, OR its
  # RPE reaches the RPE figure, OR its name mentions a race, test, FTP or marathon.
  #high_intensity_rpe_threshold: 8
  #high_intensity_tss_threshold: 120.0
  # How the app lines your signals up against the mornings around them, so the coach can
  # see what alcohol or a bad night actually did to you.
  # 'lookahead' does two jobs at once. It is the number of mornings shown either side of an
  # episode; and it is the gap that separates episodes — consecutive signal days closer
  # together than this are read as one episode rather than two. At 3, two drinking nights
  # two days apart are one episode, and each episode is shown with the 3 mornings before
  # and the 3 after.
  # 'min_days' is a floor: a category with fewer total signal-days than this on record is
  # left out of the coach's view altogether, having too little behind it to read anything
  # into.
  #signal_days_lookahead: 3
  #signal_days_min_days: 1
  # Extra signal categories to offer the coach, written as 'name: what counts as this'.
  # These ADD to the set the app ships (alcohol, disturbed_sleep, illness, heat, stress,
  # travel, underfuelling); reuse a shipped name here to reword its description. The list
  # is a suggestion rather than a whitelist — both you (`signal add`) and the coach may use
  # a category outside it, and a new one is flagged for you to confirm, not refused.
  # Where a category has a natural unit, say so in the description: that is where the coach
  # learns the unit, and it fills in 'value' only from a number you actually stated.
  # WARNING: a category about sleep MUST have "sleep" in its name. The guard that stops the
  # analysis "discovering" that bad sleep predicts bad sleep works by matching that
  # substring, so a category called 'insomnia' would silently lose it
  # (DESIGN_signal_extraction.md §4). Renaming a category also splits its history in two:
  # the name is matched exactly, so old entries never join up with new ones.
  #signal_metrics:
  #  altitude: "sleeping or training above ~1500 m; value = altitude in metres"
  #  medication: "a drug that moves recovery — antihistamine, steroid, decongestant"
  #  menstrual_cycle: "cycle phase or symptoms affecting recovery"
  # Load below which an activity counts as "minor". Two effects: a matched session gets a
  # wider planned-vs-actual tolerance, and an unmatched one is labelled '(minor)' instead of
  # 'UNPLANNED' — a 20-minute walk should not read as a deviation from the plan.
  #minor_activity_load_threshold: 25.0
  # Sometimes a session measures easy and felt brutal: heat, sleep debt, muscular damage,
  # kettlebell HIIT the heart-rate strap simply cannot see. When the load your RPE implies
  # is at least this many times the measured (power/HR) load, the app takes that at face
  # value — it uses the RPE-derived load instead of the measured one, and tells the coach
  # the session felt harder than it measured. Set very high to disable.
  #rpe_divergence_ratio: 1.5
  # How far a session may stray from its plan, in duration and load, before it is called a
  # mismatch. The band is a sliding one: easy_pct applies to planned loads at or below
  # low_load, hard_pct at or above high_load, straight-line interpolation in between. Easy
  # sessions get the loose end because ten minutes either way is a big percentage of a small
  # session; hard sessions get the tight end because there the same ten minutes matters.
  #adherence_tolerance:
  #  easy_pct: 0.50
  #  hard_pct: 0.15
  #  low_load: 20.0
  #  high_load: 100.0

# Editing most of this block marks the active periodization stale and offers a replan. The
# exceptions are `name`, `equipment`, and each day's `equipment`: they reach the coach but
# cannot reshape a periodization, so changing them is silent. See DESIGN_plan_staleness.md.
user_profile:
  name: "Athlete"
  birth_year: 1980
  # Free text. Reaches every coaching prompt so sex-specific physiology — hormonal cycle,
  # substrate use, injury profile — can shape the plan. Omit it and the coach plans
  # sex-neutral.
  gender: "female"
  max_hr: 185
  # max_hr is the only anchor that lives here, because it barely moves. The trainable ones
  # — FTP, LTHR, threshold pace, CSS, e1RM — go in the dated benchmark logbook instead,
  # which is the source the coach reads:
  #   tm benchmark record cycling --ftp 220
  #   tm benchmark record running --lthr 165
  # With none on record the coach prescribes by RPE and heart-rate feel and schedules a
  # benchmark to establish them. A logbook value always beats a same-named key here.
  weekly_target_hours: 6.0
  sport_preferences:
    - "running"
    - "cycling"
    - "hiking"
    - "strength_training"
    - "yoga"
    - "ski_touring"
  chronic_injuries: |
    Sensitive lower back. Avoid high-impact running on pavement when flared up.
  preferences: |
    Enjoys morning workouts. Prefers outdoor trail runs and road cycling.
  equipment:
    - "Garmin watch"
    - "running shoes"
    - "road bike"
  # Per-day availability. Optional: omit the whole block and the coach puts sessions on any
  # day, sizing the week by weekly_target_hours. certainty_percent is how likely you are to
  # actually train that day — the coach leans on your reliable days for the work that
  # matters and treats the others as bonus.
  weekly_schedule:
    Monday:
      total_available_hours: 1.0
      max_sessions: 1
      certainty_percent: 100
      equipment:
        - "kettlebells"
        - "dumbbells"
        - "yoga mat"
    Tuesday:
      total_available_hours: 1.5
      max_sessions: 1
      certainty_percent: 80
      equipment:
        - "road bike"
        - "home trainer"
    Wednesday:
      total_available_hours: 0.0
      max_sessions: 0
      certainty_percent: 100
      equipment: []
    Thursday:
      total_available_hours: 1.5
      max_sessions: 1
      certainty_percent: 80
      equipment:
        - "road bike"
        - "home trainer"
    Friday:
      total_available_hours: 1.0
      max_sessions: 1
      certainty_percent: 90
      equipment:
        - "kettlebells"
        - "dumbbells"
        - "yoga mat"
    Saturday:
      total_available_hours: 3.0
      max_sessions: 2
      certainty_percent: 70
      equipment:
        - "road bike"
    Sunday:
      total_available_hours: 2.0
      max_sessions: 1
      certainty_percent: 70
      equipment:
        - "running shoes"
